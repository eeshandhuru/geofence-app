server {
    listen 80;

    # 1. Serve the React Frontend
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API Requests (Axios)
    location /api/ {
        # 'backend' matches the service name in docker-compose.yml
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:4000/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Proxy WebSocket Requests (Socket.io)
    location /socket.io/ {
        proxy_pass http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        
        # Essential for WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}